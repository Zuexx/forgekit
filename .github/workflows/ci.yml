name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: api/**/*.csproj
      - run: dotnet restore ForgeKit.sln
      - run: dotnet build ForgeKit.sln --configuration Release --no-restore
      - run: dotnet test ForgeKit.sln --configuration Release --no-build
      - run: dotnet tool restore
      - name: Verify provider migrations
        run: |
          for provider in Sqlite Postgres SqlServer; do
            project="ForgeKit.Api.Migrations.${provider}"
            dotnet ef migrations list --project "$project" --startup-project "$project" --context AppDbContext --configuration Release --no-build --no-connect
            dotnet ef migrations list --project "$project" --startup-project "$project" --context BetterAuthDbContext --configuration Release --no-build --no-connect
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --context AppDbContext --configuration Release --no-build
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --context BetterAuthDbContext --configuration Release --no-build
          done

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # The end-to-end tests exercise sign-in through to the database. Without a real one
      # they would only prove that the pages render. Database__Provider is unset here, so
      # this runs against the default SQLite file -- no external service needed. Set
      # Database__Provider=Postgres (or SqlServer) plus the matching connection settings
      # to run this job against a different provider.
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate app secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Create auth schema
        run: pnpm dlx auth@1.7.7 migrate --config ./lib/auth-instance.ts -y
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec openspec validate --all --strict --no-interactive

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
