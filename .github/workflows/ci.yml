name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: api/**/*.csproj
      - run: dotnet restore ForgeKit.sln
      - run: dotnet build ForgeKit.sln --configuration Release --no-restore
      - run: dotnet test ForgeKit.sln --configuration Release --no-build
      - run: dotnet tool restore
      - name: Verify provider migrations
        run: |
          for provider in Sqlite Postgres SqlServer; do
            project="ForgeKit.Api.Migrations.${provider}"
            dotnet ef migrations list --project "$project" --startup-project "$project" --context AppDbContext --configuration Release --no-build --no-connect
            dotnet ef migrations list --project "$project" --startup-project "$project" --context BetterAuthDbContext --configuration Release --no-build --no-connect
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --context AppDbContext --configuration Release --no-build
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --context BetterAuthDbContext --configuration Release --no-build
          done

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://localhost:5432/forgekit
      # The service trusts any user; naming it here keeps it out of the connection URI,
      # where a user:host string reads as a credential to secret scanners.
      PGUSER: postgres
      BETTER_AUTH_URL: http://localhost:3000
    services:
      # The end-to-end tests exercise sign-in through to the database. Without a real one
      # they would only prove that the pages render.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forgekit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forgekit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate app secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Create auth schema
        run: pnpm dlx @better-auth/cli@latest migrate --config ./lib/auth.config.ts -y
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global @fission-ai/openspec@1.8.0
      - run: openspec validate --all --strict --no-interactive

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
