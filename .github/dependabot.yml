version: 2

# Monthly and grouped: this is a base kit that products fork and then upgrade on their own
# schedule, so keeping every patch current here buys little and costs a PR stream.
# docs/DEPENDENCY_CONSTRAINTS.md states which majors are held back and why.
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Held on their current major deliberately; docs/DEPENDENCY_CONSTRAINTS.md states the
      # reason and the condition for revisiting each. Minors and patches still come through.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: tedious
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Minors and patches in one PR; a major still arrives on its own for review.
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
