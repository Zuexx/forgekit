schema: spec-driven

context: |
  ForgeKit is a full-stack starter kit used as a development base: products are generated
  from it with `dotnet new forgekit` and then diverge. Changes should stay reusable across
  products, not tailored to the sample TODO domain.

  ## Stack

  - Backend: .NET 10 / ASP.NET Core minimal API, EF Core, MediatR, FluentValidation,
    JWT Bearer auth, Serilog, Scalar for OpenAPI
  - Frontend: Next.js 16 (App Router), TypeScript, Tailwind, shadcn/ui, Better Auth,
    Hono RPC, TanStack Query, next-intl
  - Database: SQLite by default; PostgreSQL and SQL Server are supported provider options

  ## Two-layer boundary (read before touching api/)

  The API is split so base improvements can reach already-generated products:

  - `api/Anvil/` is the shared layer. The template never renames it, so its paths are
    identical in every product and upstream changes sync with
    `git checkout upstream/main -- api/Anvil`. It MUST NOT reference the product project.
  - `api/ForgeKit.Api/` is the product layer and is renamed per product.

  A file belongs in Anvil only if its transitive import closure contains no product type.
  When a shared file appears to need a product type, invert the dependency through an
  interface owned by Anvil rather than moving the file out. See ADR-008 and the
  `platform-core` spec.

  ## Conventions

  - Architecture: modules expose endpoints, MediatR handlers hold request logic, services
    and domain services hold behavior, EF Core is used directly rather than behind
    repositories (ADR-004). Results use the Result pattern (ADR-006); exceptions are
    mapped centrally by middleware.
  - Soft delete is global: entities implementing `ISoftDelete` get a query filter applied
    by `PlatformDbContext` automatically (ADR-002).
  - Migrations are provider-specific. When the EF model changes, add migrations for all
    three provider projects; never reuse one provider's migrations for another.
  - Tests: xUnit with Shouldly. Unit tests for handlers, validators, and domain logic;
    SQLite for relational integration tests. Frontend uses vitest for units and Playwright for
    end-to-end coverage of the auth flow against a real database.
  - Commits follow Conventional Commits; see docs/api/COMMIT_CONVENTION.md.
  - Branch off main as `feature/`, `fix/`, `chore/`, or `refactor/`; open a PR so CI runs
    before merging.

  ## Constraints

  - Breaking API changes require a change proposal.
  - Do not commit local secrets. `appsettings.Local.json` and `.env.local` are ignored and
    have committed `.example` counterparts.
  - The frontend's Better Auth adapter requires PostgreSQL even when the API uses SQLite.

  ## Reference docs

  - `docs/STRUCTURE.md` — project layout and the layer boundary
  - `docs/FORKING_GUIDE.md` — generating a product and syncing base updates
  - `docs/adr/` — architecture decisions
  - `docs/api/logging.md` — structured logging patterns and examples

rules:
  tasks:
    - Break work into tasks completable in 5 to 15 minutes each.
    - A task that cannot be verified on its own is too coarse. Split it until each
      one has an observable outcome — a build that passes, a test that goes green,
      a file that exists.
    - Prefer many small tasks over few large ones. "Move 40 files" is one task on
      paper and an hour of unverifiable work in practice; split it by area.
    - Put decisions that block implementation in a leading section, so they are
      settled before any code is written rather than discovered mid-task.

operations:
  apply:
    guidance:
      - Work test-first where the change is behavioral. The `tdd` skill defines what
        counts as a good test; follow it rather than writing tests that assert
        implementation details.
      - Run the test suite after each task rather than at the end, so a failure points
        at one task instead of a batch.
      - When a task reveals that the plan was wrong, update the change rather than
        silently diverging from it. The change is the record.
      - State the test counts before and after. A refactor that changes them needs an
        explanation.
  archive:
    guidance:
      - Before archiving, verify the implementation against the change's own spec
        deltas, not just against the task checklist. Ticked boxes are a claim; the
        specs are the acceptance criteria.
      - Note anything the implementation did differently from the proposal, and why.
        A design assumption that turned out wrong is worth recording.
